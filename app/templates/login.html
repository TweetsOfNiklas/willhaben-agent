<!doctype html>
<html lang="{{ ui_lang() }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ _("Log in") }} · willhaben Agent</title>
  <script>try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/ui.css">
</head>
<body class="login-wrap">
  <div style="width:min(400px,100%);display:flex;flex-direction:column;gap:14px">
    <div class="card" style="border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 16px 48px rgba(0,0,0,.08);padding:28px 28px 22px;display:flex;flex-direction:column;gap:20px">
      <div class="row" style="gap:12px;flex-wrap:nowrap"><span class="logo" style="width:40px;height:40px;border-radius:11px;font-size:21px">w</span><div><div style="font-weight:650;font-size:17px;letter-spacing:-.01em">willhaben Agent</div><div class="muted" style="font-size:13px">{{ _("Log in to the dashboard") }}</div></div></div>
      {% if error %}<div class="msg error" role="alert" style="margin:0;font-size:13px">{{ error }}</div>{% endif %}
      <form method="post" action="/login" style="display:flex;flex-direction:column;gap:14px">
        <input type="hidden" name="next" value="{{ next }}">
        <label class="field"><span>{{ _("User name") }}</span><input name="username" value="{{ user or '' }}" autocomplete="username" autocapitalize="none" spellcheck="false" required style="font-size:15px"></label>
        <label class="field"><span>{{ _("Password") }}</span><span style="position:relative;display:flex"><input type="password" name="password" id="pw" autocomplete="current-password" required {% if user %}autofocus{% endif %} style="padding-right:68px;font-size:15px"><button type="button" id="pw-toggle" class="btn ghost xs" style="position:absolute;right:6px;top:50%;transform:translateY(-50%)">{{ _("Show") }}</button></span></label>
        <label class="switch-row" style="margin-top:2px"><span style="font-size:13.5px">{{ _("Stay logged in for 30 days") }}</span><input type="checkbox" class="switch" name="remember" checked></label>
        <button class="btn" style="height:42px;font-size:15px;font-weight:600;margin-top:4px" onclick="this.setAttribute('aria-busy','true')">{{ _("Log in") }}</button>
      </form>
      <div class="muted" style="font-size:12px;text-align:center;border-top:1px solid var(--border);padding-top:14px">{{ _("The password is DASHBOARD_PASSWORD from the .env file.") }}</div>
    </div>
    <div class="row muted" style="justify-content:space-between;font-size:12px;padding:0 6px"><span>v{{ app_version }} · {{ _("by {author}", author=app_author) }}</span>
      <form method="post" action="/lang" style="margin:0"><select name="lang" aria-label="{{ _('Language') }}" onchange="this.form.submit()" style="width:auto;padding:2px 26px 2px 6px;font-size:12px;background-color:var(--surface)">
        {% set pref = ui_lang_pref() %}<option value="auto" {% if pref not in ui_langs %}selected{% endif %}>{{ _("Automatic (browser)") }}</option>
        {% for code, name in ui_langs.items() %}<option value="{{ code }}" {% if pref == code %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></form></div>
  </div>
  <script>
    const pw = document.getElementById('pw'), b = document.getElementById('pw-toggle'), T = {show: {{ _("Show")|tojson }}, hide: {{ _("Hide")|tojson }}};
    b.addEventListener('click', () => { const show = pw.type === 'password'; pw.type = show ? 'text' : 'password'; b.textContent = show ? T.hide : T.show; pw.focus(); });
  </script>
</body>
</html>
