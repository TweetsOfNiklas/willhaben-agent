<!doctype html>
<html lang="{{ ui_lang() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ _("Log in") }} · willhaben Agent</title>
  <script>
    try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.cyan.min.css">
  <style>
    :root { --brand: #0e9fb5; --bad: #e5484d; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 1rem;
           background: radial-gradient(60rem 30rem at 50% -10%, color-mix(in srgb, var(--brand) 18%, transparent), transparent),
                       var(--pico-background-color); }
    .login { width: 100%; max-width: 24rem; margin: 0; padding: 2rem 1.75rem 1.5rem; }
    .brand { display: flex; align-items: center; gap: .6rem; margin-bottom: 1.5rem; }
    .logo { width: 2.4rem; height: 2.4rem; border-radius: .65rem; background: var(--brand); color: #fff;
            display: grid; place-items: center; font-weight: 700; font-size: 1.3rem; }
    .brand strong { color: var(--brand); font-size: 1.2rem; display: block; line-height: 1.2; }
    .brand small { color: var(--pico-muted-color); }
    .error { border-left: 4px solid var(--bad); padding: .45rem .75rem; margin-bottom: 1rem; font-size: .9rem;
             background: color-mix(in srgb, var(--bad) 10%, transparent); border-radius: .25rem; }
    .pw { position: relative; display: block; margin-bottom: var(--pico-spacing); }
    .pw input { padding-right: 4.5rem; margin-bottom: 0; }
    .pw button { position: absolute; right: .35rem; top: 50%; transform: translateY(-50%); width: auto; margin: 0; padding: .35rem .6rem;
                 background: none; border: none; color: var(--pico-muted-color); font-size: .8rem; }
    .pw button:hover { color: var(--brand); }
    label.remember { margin: .25rem 0 1.25rem; font-size: .9rem; }
    button[type=submit] { width: 100%; margin: 0; }
    footer { margin-top: 1.25rem; text-align: center; font-size: .78rem; color: var(--pico-muted-color); }
  </style>
</head>
<body>
<main>
  <article class="login">
    <div class="brand">
      <span class="logo">w</span>
      <span><strong>willhaben Agent</strong><small>{{ _("Log in to the dashboard") }}</small></span>
    </div>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label>{{ _("User name") }}
        <input name="username" value="{{ user or '' }}" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>{{ _("Password") }}
        <span class="pw">
          <input type="password" name="password" id="pw" autocomplete="current-password" required {% if user %}autofocus{% endif %}>
          <button type="button" id="pw-toggle" aria-label="{{ _('Show password') }}">{{ _("Show") }}</button>
        </span></label>
      <label class="remember"><input type="checkbox" role="switch" name="remember" checked> {{ _("Stay logged in for 30 days") }}</label>
      <button type="submit" onclick="this.setAttribute('aria-busy','true')">{{ _("Log in") }}</button>
    </form>
    <footer>{{ _("The password is DASHBOARD_PASSWORD from the .env file.") }}</footer>
  </article>
</main>
<script>
  const pw = document.getElementById('pw'), b = document.getElementById('pw-toggle');
  const T = {show: {{ _("Show")|tojson }}, hide: {{ _("Hide")|tojson }}};
  b.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    b.textContent = show ? T.hide : T.show;
    pw.focus();
  });
</script>
</body>
</html>
