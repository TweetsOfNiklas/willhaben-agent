{# Buy dialog: any plain click on <a data-buy="<ad id>" href="/purchases/new/<ad id>"> (product search, ad viewer) opens
   it and puts _buy_dialog.html in. Ctrl/Cmd/Shift-click and middle-click keep the normal link. Esc and ✕ close it; it can
   open above the ad viewer. #}
<dialog id="buy-dialog" data-loading="{{ _('Loading ad …') }}" data-error="{{ _('Error {status}') }}"
        data-offline="{{ _('Connection failed') }}">
  <article class="bd-card">
    <header>
      <strong>🛒 {{ _("Buy") }}</strong>
      <button type="button" class="bd-close" aria-label="{{ _('Close') }}" title="{{ _('Close (Esc)') }}">✕</button>
    </header>
    <div class="bd-body"></div>
  </article>
</dialog>
<style>
  #buy-dialog { padding: 0; border: none; background: transparent; max-width: min(1000px, 96vw); width: 96vw; }
  #buy-dialog::backdrop { background: rgba(0, 0, 0, .55); }
  #buy-dialog > article { margin: 0 auto; max-height: 92vh; overflow: auto; width: min(960px, 94vw); max-width: none; }   /* Pico caps dialog articles at ~700px */
  #buy-dialog header { display: flex; align-items: center; gap: .5rem; position: sticky; top: 0; z-index: 1; }
  #buy-dialog header .bd-close { margin: 0 0 0 auto; width: auto; padding: .15rem .7rem; }
  .bd-body > .msg, .bd-body > p { margin-top: .5rem; }
  .bd-form { margin: 0; }
  .bd-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 1.4rem; }
  @media (max-width: 760px) { .bd-grid { grid-template-columns: 1fr; gap: .6rem; } }
  .bd-img { width: 100%; max-height: 260px; object-fit: contain; background: #111; border-radius: .4rem; }
  .bd-noimg { height: 120px; background: var(--pico-card-sectioning-background-color); }
  .bd-title { margin: .6rem 0 .2rem; font-size: 1.1rem; }
  .bd-price { font-size: 1.3rem; font-weight: 700; margin: 0 0 .3rem; }
  .bd-badges { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; margin: .3rem 0; }
  .badge.brand { background: var(--brand); color: #fff; }
  .bd-ad .meta { margin: .2rem 0; font-size: .875rem; color: var(--pico-muted-color); }
  .bd-desc { margin: .4rem 0; font-size: .875rem; }
  .bd-desc summary { cursor: pointer; color: var(--pico-muted-color); }
  .bd-desc p { white-space: pre-wrap; line-height: 1.45; margin: .4rem 0 0; }
  .bd-links { display: flex; flex-wrap: wrap; gap: .4rem; margin: .6rem 0 0; }
  .bd-links a[role=button] { width: auto; margin: 0; padding: .3rem .8rem; font-size: .9em; }
  /* info icon: the explanation is its title tooltip */
  .bd-info { display: inline-grid; place-items: center; flex: none; width: 1.1rem; height: 1.1rem; margin-left: .25rem; border-radius: 50%;
             border: 1px solid var(--pico-muted-border-color); color: var(--pico-muted-color); font-size: .72rem; font-style: normal;
             line-height: 1; cursor: help; vertical-align: middle; }
  /* step chips */
  .bd-chips { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; list-style: none; margin: 0 0 .9rem; padding: 0; }
  .bd-chips li { display: flex; align-items: center; gap: .3rem; }
  .bd-chips li + li::before { content: "→"; color: var(--pico-muted-color); font-size: .8rem; }
  .bd-chip { display: inline-flex; align-items: center; gap: .4rem; width: auto; margin: 0; padding: .2rem .65rem .2rem .2rem; font-size: .85rem;
             line-height: 1.2; background: transparent; color: var(--pico-muted-color); border: 1px solid var(--pico-muted-border-color);
             border-radius: 2rem; }
  .bd-chip.done, .bd-chip.on { color: var(--pico-h3-color); }   /* heading colour: Pico sets --pico-color to white on buttons (invisible in the light theme) */
  .bd-chip.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); font-weight: 600; }
  .bd-chip:disabled { cursor: default; opacity: .6; }
  .bd-n { display: inline-grid; place-items: center; flex: none; width: 1.35rem; height: 1.35rem; border-radius: 50%;
          background: var(--pico-muted-color); color: #fff; font-size: .75rem; font-weight: 700; }
  .bd-chip.on .bd-n { background: var(--brand); }
  .bd-chip.done .bd-n { background: var(--ok); font-size: 0; }
  .bd-chip.done .bd-n::after { content: "✓"; font-size: .8rem; }
  .bd-step[hidden] { display: none; }
  .bd-step h4 { margin: 0 0 .5rem; }
  /* step 1: mode cards */
  .bd-modes { display: grid; grid-template-columns: minmax(0, 1fr); gap: .45rem; }
  .bd-mode { display: flex; gap: .6rem; align-items: center; margin: 0; padding: .5rem .75rem; font-weight: 400;
             border: 1px solid var(--pico-muted-border-color); border-radius: var(--radius); cursor: pointer; }
  .bd-modes > .bd-mode { width: 100%; box-sizing: border-box; }   /* Pico: label:has(radio) is fit-content wide, and out-ranks a plain class */
  .bd-mode input[type=radio] { flex: none; width: 1.05rem; height: 1.05rem; margin: 0; }
  .bd-mode-text { flex: 1; min-width: 0; }
  .bd-mode-text strong { display: block; }
  .bd-mode-text small { display: block; margin-top: .05rem; color: var(--pico-muted-color); }
  .bd-mode .bd-info { margin-left: auto; }
  .bd-mode:has(input:checked) { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .bd-mode.off { opacity: .5; cursor: not-allowed; }
  .bd-time { display: none; margin: .2rem 0 0; }
  .bd-form:has(input[name=mode][value=pickup]:checked) .bd-time { display: block; }
  /* step 2: the field (what the eye lands on first), then one price-fairness hint: level badge and sentence, the deal bar
     of the product search with a needle at the asking price and a ring at the maximum (drag it to change the price), the
     cheapest and the most expensive comparable price at its ends, at most three suggestion chips */
  .bd-max { display: block; margin: 0; }
  .bd-lab { display: block; font-weight: 600; }
  .bd-field { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .5rem; margin: .3rem 0 0; }
  .bd-eur { color: var(--pico-muted-color); font-size: 1.15rem; }
  .bd-field input { flex: none; width: 9.5rem; margin: 0; font-size: 1.15rem; font-weight: 600; }
  .bd-field input[type=number] { -moz-appearance: textfield; appearance: textfield; }   /* no up/down spinner */
  .bd-field input[type=number]::-webkit-inner-spin-button, .bd-field input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
  .bd-pill { display: inline-block; padding: .05rem .55rem; border-radius: 1em; font-size: .8rem; font-weight: 600; line-height: 1.5; }
  .bd-pill[hidden] { display: none; }
  .bd-fair { margin: .9rem 0 0; padding: .65rem .8rem .75rem; border: 1px solid var(--pico-muted-border-color); border-radius: var(--radius); }
  .bd-fairline { display: flex; flex-wrap: wrap; align-items: center; gap: .2rem .5rem; margin: 0 0 .55rem; font-size: .9rem; }
  .bd-fairline .bd-info { margin-left: 0; }
  /* the gauge is taller than the track: a hand-sized target to grab; touch-action none so a finger drags the ring, not the page */
  .bd-gauge { position: relative; height: 1.7rem; margin: 0 .35rem; }
  .bd-gauge .deal-track { position: absolute; left: 0; right: 0; top: .6rem; height: .5rem; border-radius: .3rem;
                          background: linear-gradient(90deg, #2f9e44 0%, #94c11f 28%, #f5c400 50%, #f76707 75%, #e5484d 100%); }
  .bd-gauge .deal-needle { position: absolute; top: .45rem; width: 4px; height: .8rem; margin-left: -2px; border-radius: 2px;
                           background: var(--pico-color); box-shadow: 0 0 0 2px var(--pico-card-background-color); }
  /* the ring sits around the needle at the default (it is the same size everywhere, so there is always something to drag) */
  .bd-pin { position: absolute; top: .3rem; width: 1.1rem; height: 1.1rem; margin-left: -.55rem; box-sizing: border-box; border-radius: 50%;
            border: 2.5px solid var(--pico-color); box-shadow: 0 0 0 1.5px var(--pico-card-background-color); transition: left .15s; pointer-events: none; }
  .bd-pin[hidden] { display: none; }
  .bd-drag { cursor: ew-resize; touch-action: none; user-select: none; -webkit-user-select: none; }
  .bd-drag.drag .bd-pin { transition: none; }
  .bd-ends { display: flex; justify-content: space-between; margin: 0 .35rem; color: var(--pico-muted-color); font-size: .75rem; line-height: 1.2; }
  .bd-sugg { display: flex; flex-wrap: wrap; gap: .35rem; margin: .75rem 0 0; }
  .bd-sugg button { display: inline-flex; align-items: center; gap: .35rem; width: auto; margin: 0; padding: .15rem .7rem; font-size: .8rem;
                    line-height: 1.5; background: transparent; color: var(--pico-h3-color); border: 1px solid var(--pico-muted-border-color);
                    border-radius: 2rem; }   /* not --pico-color: white on buttons */
  .bd-sugg button::before { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: var(--dot); }
  .bd-sugg .k-min { --dot: #2f9e44; } .bd-sugg .k-cheap { --dot: #66a80f; } .bd-sugg .k-market { --dot: #e8a600; }
  .bd-sugg button.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  /* step 3: summary list */
  .bd-summary { list-style: none; margin: 0 0 .8rem; padding: 0; border: 1px solid var(--pico-muted-border-color); border-radius: var(--radius); }
  .bd-row { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: .2rem .6rem; align-items: start; margin: 0;
            padding: .5rem .75rem; border-top: 1px solid var(--pico-muted-border-color); }
  .bd-row:first-child { border-top: none; }
  .bd-row[hidden] { display: none; }
  .bd-k { color: var(--pico-muted-color); font-size: .85rem; padding-top: .1rem; }
  .bd-v { min-width: 0; }
  .bd-v strong { display: block; }
  .bd-v small { display: block; color: var(--pico-muted-color); }
  .bd-v .bd-inl { display: inline; margin-right: .4rem; }
  .bd-v .bd-fairline { margin: 0; }
  .bd-row button.linklike { width: auto; margin: 0; padding: 0; font-size: .85rem; }
  .bd-foot { margin: .4rem 0 0; text-align: right; color: var(--pico-muted-color); }
  .bd-foot a { margin-left: .4rem; text-decoration: none; }
  /* navigation rows */
  .bd-nav { display: flex; gap: .5rem; align-items: center; justify-content: space-between; margin-top: .7rem; }
  .bd-nav button { width: auto; margin: 0; }
  .bd-nav .bd-next { margin-left: auto; }
  .bd-nav .bd-start { flex: 1; }
  /* the ad column on a phone: one line (thumbnail, title, price) above the steps */
  @media (max-width: 760px) {
    .bd-ad { display: flex; align-items: center; gap: .6rem; }
    .bd-ad .bd-img { width: 3.2rem; height: 3.2rem; max-height: none; flex: none; }
    .bd-ad .bd-noimg, .bd-ad .bd-badges, .bd-ad .meta, .bd-ad .bd-desc, .bd-ad .bd-links { display: none; }
    .bd-ad .bd-title { flex: 1; min-width: 0; margin: 0; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bd-ad .bd-price { flex: none; margin: 0; font-size: 1rem; }
    .bd-row { grid-template-columns: minmax(0, 1fr) auto; }
    .bd-k { grid-column: 1 / -1; }
  }
  /* without JavaScript: all three panels, the submit button only */
  .bd-form:not(.bd-js) :is(.bd-chips, .bd-next, .bd-back, .bd-summary) { display: none; }
</style>
<script>
(() => {
  const dlg = document.getElementById('buy-dialog'), body = dlg && dlg.querySelector('.bd-body');
  // every buy form on the page (the dialog's, or a full buy page) gets its steps and its lines
  const prepare = () => { if (window.wbBuy) document.querySelectorAll('.bd-form').forEach(f => wbBuy.init(f)); };
  prepare();
  if (!dlg || !dlg.showModal) return;
  const T = dlg.dataset;
  const msg = (cls, text) => { const p = document.createElement('p'); p.className = cls; p.textContent = text; return p; };
  let seq = 0;

  async function open(href) {
    const me = ++seq;
    body.replaceChildren(msg('muted', T.loading));
    if (dlg.open) dlg.close();                 // already open (under the viewer): back to the front
    dlg.showModal();
    dlg.querySelector('article').scrollTop = 0;
    try {
      const r = await fetch(href, {headers: {'X-Requested-With': 'fetch'}});
      if (me !== seq) return;                                       // another ad was opened meanwhile
      if (r.ok || r.status === 404) body.innerHTML = await r.text(); // 404: the ad is gone, the fragment says so
      else body.replaceChildren(msg('msg', T.error.replace('{status}', r.status)));
      if (window.htmx) htmx.process(body);
      prepare();
    } catch (e) {
      if (me === seq) body.replaceChildren(msg('msg', T.offline));
    }
  }

  const plain = e => e.button === 0 && !(e.ctrlKey || e.metaKey || e.shiftKey || e.altKey);
  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-buy]');
    if (!a || !plain(e)) return;
    e.preventDefault();
    open(a.getAttribute('href'));
  });
  // "Viewer" from this dialog while the viewer is already open underneath: the viewer comes to the front
  document.addEventListener('click', e => {
    if (dlg.open && plain(e) && e.target.closest('a[data-ad]') && document.getElementById('ad-viewer')?.open) dlg.close();
  }, true);
  dlg.addEventListener('click', e => {
    if (e.target === dlg || e.target.closest('.bd-close')) dlg.close();   // backdrop or ✕
  });
})();
</script>
