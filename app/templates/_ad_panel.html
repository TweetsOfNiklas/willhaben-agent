{% import "_ui.html" as ui %}
{# Ad viewer dialog (included by base.html on every page). Script hooks: #ad-viewer, [data-adv-body], [data-adv-pos], [data-step],
   [data-adv-close], [data-adv-thumbs] img (data-on marks the picture shown), [data-adv-main], button[data-state]. #}
<dialog id="ad-viewer" class="modal p-0 backdrop:bg-[rgba(10,14,20,.55)]" data-loading="{{ _('Loading ad …') }}" data-error="{{ _('Error {status}') }}" data-offline="{{ _('Connection failed') }}">
  <article class="modal-box flex max-h-[92vh] w-[min(1120px,96vw)] max-w-none flex-col overflow-auto rounded-2xl border border-base-300 bg-base-100 p-0 shadow-[0_24px_80px_rgba(0,0,0,.35)] max-md:h-dvh max-md:max-h-dvh max-md:w-screen max-md:rounded-none">
    <header class="sticky top-0 z-[1] flex items-center gap-2 border-b border-base-300 bg-base-100 py-2.5 pr-3 pl-4">
      <button type="button" class="btn btn-ghost btn-sm w-8 px-0" data-step="-1" title="{{ _('Previous (←)') }}" aria-label="{{ _('Previous (←)') }}">{{ ui.icon('chevron-right', 16, 2, 'rotate-180') }}</button>
      <button type="button" class="btn btn-ghost btn-sm w-8 px-0" data-step="1" title="{{ _('Next (→)') }}" aria-label="{{ _('Next (→)') }}">{{ ui.icon('chevron-right', 16) }}</button>
      <span class="text-[13px] text-muted tabular-nums" data-adv-pos></span>
      <button type="button" class="btn btn-ghost btn-sm btn-square ml-auto text-muted" data-adv-close aria-label="{{ _('Close') }}" title="{{ _('Close (Esc)') }}">{{ ui.icon('x', 16) }}</button>
    </header>
    <div data-adv-body></div>
  </article>
</dialog>
<script>
(() => {
  const dlg = document.getElementById('ad-viewer');
  if (!dlg || !dlg.showModal) return;
  const body = dlg.querySelector('[data-adv-body]'), pos = dlg.querySelector('[data-adv-pos]'), T = dlg.dataset;
  // one element per message; the classes are literal here so the stylesheet build finds them
  const msg = (cls, text) => { const p = document.createElement('p'); p.className = cls; p.textContent = text; return p; };
  const loading = text => {
    const p = msg('flex items-center gap-2.5 px-6 py-6 text-muted', text);
    p.prepend(Object.assign(document.createElement('span'), {className: 'loading loading-spinner loading-sm'}));
    return p;
  };
  let list = [], idx = -1;
  // a ref is the ad id, or "<platform>:<id>" for sites other than willhaben (app/platforms)
  const path = ref => { const i = ref.indexOf(':'); return i < 0 ? '/hits/ad/' + encodeURIComponent(ref)
    : '/hits/ad/' + encodeURIComponent(ref.slice(0, i)) + '/' + encodeURIComponent(ref.slice(i + 1)); };

  // One entry per ad, in page order (a card can have several links to the same ad).
  const collect = () => {
    const seen = new Set(), out = [];
    document.querySelectorAll('a[data-ad]').forEach(a => {
      if (!seen.has(a.dataset.ad)) { seen.add(a.dataset.ad); out.push({ad: a.dataset.ad, hit: a.dataset.hit || ''}); }
    });
    return out;
  };

  async function show(i) {
    if (i < 0 || i >= list.length) return;
    idx = i;
    const {ad, hit} = list[i];
    pos.textContent = list.length > 1 ? `${i + 1} / ${list.length}` : '';
    body.replaceChildren(loading(T.loading));
    if (!dlg.open) dlg.showModal();
    try {
      const r = await fetch(`${path(ad)}${hit ? '?hit=' + encodeURIComponent(hit) : ''}`);
      if (idx !== i) return;                         // user moved on meanwhile
      if (r.ok) { body.innerHTML = await r.text(); if (window.htmx) htmx.process(body); }
      else body.replaceChildren(msg('px-6 py-6 text-error', T.error.replace('{status}', r.status)));
    } catch (e) { body.replaceChildren(msg('px-6 py-6 text-error', T.offline)); }
    dlg.querySelector('article').scrollTop = 0;
    if (hit) { const card = document.getElementById('hit-' + hit); if (card) card.dataset.viewed = 'true'; }
  }

  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-ad]');
    if (!a || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    list = collect();
    show(list.findIndex(x => x.ad === a.dataset.ad));
  });

  dlg.addEventListener('click', async e => {
    if (e.target === dlg) return dlg.close();                       // click on the backdrop
    const nav = e.target.closest('[data-step]');
    if (nav) return show(idx + Number(nav.dataset.step));
    if (e.target.closest('[data-adv-close]')) return dlg.close();
    const thumb = e.target.closest('[data-adv-thumbs] img');
    if (thumb) {
      const main = dlg.querySelector('[data-adv-main]');
      if (main.tagName === 'IMG') { main.hidden = false; main.src = thumb.dataset.full; }
      dlg.querySelectorAll('[data-adv-thumbs] img').forEach(t => { t.dataset.on = t === thumb ? 'true' : 'false'; });
      return;
    }
    const st = e.target.closest('button[data-state]');
    if (st) {
      st.disabled = true;                                           // the button greys out while the request runs
      const fd = new FormData(); fd.append('state', st.dataset.state);
      const r = await fetch(`/hits/${st.dataset.hit}/state`, {method: 'POST', body: fd, headers: {'HX-Request': 'true'}});
      if (r.ok) {
        const card = document.getElementById('hit-' + st.dataset.hit);
        if (card) card.remove();                                    // gone from this view, like the card buttons
        list.splice(idx, 1);
        if (list.length) show(Math.min(idx, list.length - 1)); else dlg.close();
      } else st.disabled = false;
    }
  });

  document.addEventListener('keydown', e => {
    if (!dlg.open || document.getElementById('buy-dialog')?.open) return;   // the buy dialog above keeps the keys
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;   // typing keeps its arrow keys
    if (e.key === 'ArrowRight') { e.preventDefault(); show(idx + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(idx - 1); }
  });

  // deep link from a phone push: ?view=<ref> opens the viewer (with the page's ads to step through if it is listed)
  const url = new URL(location.href), view = url.searchParams.get('view');
  if (view && /^(?:[a-z][a-z0-9_]*:)?[\w-]+$/.test(view)) {
    list = collect();
    const i = list.findIndex(x => x.ad === view);
    if (i < 0) list = [{ad: view, hit: ''}];
    show(Math.max(i, 0));
    url.searchParams.delete('view');
    history.replaceState(history.state, '', url.pathname + url.search + url.hash);
  }
})();
</script>
