{# Ad viewer dialog. The <script> block from the old file is unchanged (hooks: #ad-viewer, .adv-body, .adv-pos, [data-step], .adv-close, .adv-thumbs img, button[data-state]). #}
<dialog id="ad-viewer" data-loading="{{ _('Loading ad …') }}" data-error="{{ _('Error {status}') }}" data-offline="{{ _('Connection failed') }}" style="width:min(1120px,96vw);max-width:none;max-height:100vh;padding:24px 0">
  <article class="card" style="margin:0 auto;max-height:92vh;overflow:auto;border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.35);display:flex;flex-direction:column">
    <header style="display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;font-weight:400">
      <button type="button" class="adv-nav btn secondary sm" data-step="-1" title="{{ _('Previous (←)') }}" style="width:32px;padding:0">‹</button>
      <button type="button" class="adv-nav btn secondary sm" data-step="1" title="{{ _('Next (→)') }}" style="width:32px;padding:0">›</button>
      <span class="adv-pos muted" style="font-size:13px"></span>
      <button type="button" class="adv-close icon-btn" aria-label="{{ _('Close') }}" title="{{ _('Close (Esc)') }}" style="margin-left:auto">✕</button>
    </header>
    <div class="adv-body"></div>
  </article>
</dialog>
<style>
  #ad-viewer::backdrop { background: rgba(10,14,20,.55); }
  .adv { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(320px,1fr); }
  .adv-gallery { padding:16px; background:var(--bg); display:flex; flex-direction:column; gap:8px; }
  .adv-info { padding:18px 20px 20px; display:flex; flex-direction:column; gap:14px; border-left:1px solid var(--border); min-width:0; }
  .adv-main { width:100%; aspect-ratio:4/3; object-fit:contain; background:#111; border-radius:10px; }
  .adv-empty { display:grid; place-items:center; color:#aaa; }
  .adv-thumbs { display:flex; flex-wrap:wrap; gap:6px; }
  .adv-thumbs img { width:64px; height:48px; object-fit:cover; border-radius:6px; cursor:pointer; opacity:.6; }
  .adv-thumbs img.on, .adv-thumbs img:hover { opacity:1; outline:2px solid var(--brand); }
  .adv-price { font-size:24px; font-weight:700; letter-spacing:-.02em; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .adv-price .old { text-decoration:line-through; color:var(--muted); font-size:14px; font-weight:400; }
  .adv-desc { white-space:pre-wrap; font-size:13.5px; line-height:1.5; }
  .adv-claude { border-left:3px solid var(--brand); background:var(--brand-soft); border-radius:8px; padding:10px 14px; display:flex; flex-direction:column; gap:6px; }
  .adv-reason { white-space:pre-wrap; font-size:13.5px; line-height:1.5; }
  @media (max-width:760px) { .adv { grid-template-columns:1fr; } .adv-info { border-left:0; } #ad-viewer { width:100vw; padding:0; } #ad-viewer > article { border-radius:0; max-height:100vh; } }
</style>
<script>
(() => {
  const dlg = document.getElementById('ad-viewer');
  if (!dlg || !dlg.showModal) return;
  const body = dlg.querySelector('.adv-body'), pos = dlg.querySelector('.adv-pos'), T = dlg.dataset;
  const msg = (cls, text) => { const p = document.createElement('p'); p.className = cls; p.textContent = text; return p; };
  let list = [], idx = -1;

  // One entry per ad, in page order (a card can have several links to the same ad).
  const collect = () => {
    const seen = new Set(), out = [];
    document.querySelectorAll('a[data-ad]').forEach(a => {
      if (!seen.has(a.dataset.ad)) { seen.add(a.dataset.ad); out.push({ad: a.dataset.ad, hit: a.dataset.hit || ''}); }
    });
    return out;
  };

  async function show(i) {
    if (i < 0 || i >= list.length) return;
    idx = i;
    const {ad, hit} = list[i];
    pos.textContent = list.length > 1 ? `${i + 1} / ${list.length}` : '';
    body.replaceChildren(msg('', T.loading)); body.firstChild.setAttribute('aria-busy', 'true');
    if (!dlg.open) dlg.showModal();
    try {
      const r = await fetch(`/hits/ad/${encodeURIComponent(ad)}${hit ? '?hit=' + encodeURIComponent(hit) : ''}`);
      if (idx !== i) return;                         // user moved on meanwhile
      if (r.ok) { body.innerHTML = await r.text(); if (window.htmx) htmx.process(body); } else body.replaceChildren(msg('msg', T.error.replace('{status}', r.status)));
    } catch (e) { body.replaceChildren(msg('msg', T.offline)); }
    dlg.querySelector('article').scrollTop = 0;
    if (hit) { const card = document.getElementById('hit-' + hit); if (card) card.classList.add('viewed'); }
  }

  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-ad]');
    if (!a || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    list = collect();
    show(list.findIndex(x => x.ad === a.dataset.ad));
  });

  dlg.addEventListener('click', async e => {
    if (e.target === dlg) return dlg.close();                       // click on the backdrop
    const nav = e.target.closest('[data-step]');
    if (nav) return show(idx + Number(nav.dataset.step));
    if (e.target.closest('.adv-close')) return dlg.close();
    const thumb = e.target.closest('.adv-thumbs img');
    if (thumb) {
      dlg.querySelector('.adv-main').src = thumb.dataset.full;
      dlg.querySelectorAll('.adv-thumbs img').forEach(t => t.classList.toggle('on', t === thumb));
      return;
    }
    const st = e.target.closest('button[data-state]');
    if (st) {
      st.setAttribute('aria-busy', 'true');
      const fd = new FormData(); fd.append('state', st.dataset.state);
      const r = await fetch(`/hits/${st.dataset.hit}/state`, {method: 'POST', body: fd, headers: {'HX-Request': 'true'}});
      if (r.ok) {
        const card = document.getElementById('hit-' + st.dataset.hit);
        if (card) card.remove();                                    // gone from this view, like the card buttons
        list.splice(idx, 1);
        if (list.length) show(Math.min(idx, list.length - 1)); else dlg.close();
      } else st.removeAttribute('aria-busy');
    }
  });

  document.addEventListener('keydown', e => {
    if (!dlg.open || document.getElementById('buy-dialog')?.open) return;   // the buy dialog above keeps the keys
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;   // typing keeps its arrow keys
    if (e.key === 'ArrowRight') { e.preventDefault(); show(idx + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(idx - 1); }
  });
})();
</script>
