[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x900x24 -nolisten tcp
user=pwuser
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
command=/usr/local/bin/start-vnc.sh
user=pwuser
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
user=pwuser
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:app]
command=/opt/venv/bin/python -m app
directory=/app
user=pwuser
environment=HOME="/home/pwuser",DISPLAY=":99"
priority=40
autorestart=true
startsecs=5
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
