[project]
name = "willhaben-agent"
version = "0.1.3"
description = "Self-hosted willhaben.at agent: search agents, chat drafts with Claude, ad expiry tracking, ad drafting, dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "playwright>=1.48",
    "mcp>=1.2",
    "pypdf>=6.20.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
